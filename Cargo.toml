[package]
name = "anr"
version = "0.1.0"
edition = "2021"

[lib]
name = "anr"
path = "src/lib.rs"

[[bin]]
name = "anr"
path = "src/main.rs"

[dependencies]
# Core
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Storage and data
bytes = "1.7"
memmap2 = "0.9"
blake3 = "1.5"

# Async/concurrency
tokio = { version = "1.40", features = ["full"] }
parking_lot = "0.12"
crossbeam = "0.8"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
lazy_static = "1.4"
once_cell = "1.20"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
proptest = "1.4"

[features]
default = ["simd-auto", "plugins-static"]
simd-auto = []
simd-scalar-only = []
simd-neon = []
simd-avx = []
plugins-static = []
plugins-dynamic = []
android-support = []
